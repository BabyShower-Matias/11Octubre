<style>
:root {
  --midnight:  #0C1F2E;
  --deep-blue: #1A3D55;
  --sky:       #4D8CAD;
  --light-sky: #A8CDE0;
  --sand:      #D4A842;
  --cream:     #FAF7F2;
  --warm:      #F2EBD8;
  --border:    #D8E8F2;
  --text:      #1A3547;
  --text-mid:  #4D6E80;
  --text-lt:   #809AAA;
  --white:     #FFFFFF;
  --must-bg:   #FDE8E8; --must:  #C84040;
  --nice-bg:   #FEF3E2; --nice:  #D48010;
  --rsv-bg:    #E6F6F5; --rsv:   #2E8E8E;
  --sh:   0 2px 16px rgba(26,61,87,.09);
  --sh-lg: 0 8px 32px rgba(26,61,87,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  font-size:15px;color:var(--text);background:var(--cream);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.serif{font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;}

/* SCREENS */
.screen{display:none;min-height:100dvh;}
.screen.active{display:block;}

/* ── WELCOME HERO ── */
#screen-welcome{
  background:var(--midnight);position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:3rem 1.5rem;overflow:hidden;gap:2rem;
}
.stars{position:absolute;inset:0;pointer-events:none;}
.star{
  position:absolute;border-radius:50%;background:white;
  animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s);
}
@keyframes twinkle{0%,100%{opacity:var(--op,.7);}50%{opacity:.12;}}
.cloud{
  position:absolute;height:26px;
  background:rgba(168,205,224,.12);border-radius:50px;
  animation:drift var(--cd,60s) linear infinite var(--cdelay,0s);
}
.cloud::before,.cloud::after{content:'';position:absolute;background:inherit;border-radius:50%;}
.cloud::before{width:45%;height:200%;top:-60%;left:20%;}
.cloud::after {width:30%;height:180%;top:-50%;right:20%;}
@keyframes drift{from{transform:translateX(calc(-100% - 300px));}to{transform:translateX(calc(100vw + 300px));}}

.hero-content{position:relative;z-index:2;text-align:center;max-width:420px;}
.bear-wrap{margin-bottom:1.25rem;display:flex;justify-content:center;}
.bear-wrap svg{
  filter:drop-shadow(0 4px 24px rgba(0,0,0,.35));
  animation:float 4s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
.hero-eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--light-sky);margin-bottom:.5rem;}
.hero-name{
  font-size:clamp(3.8rem,13vw,6.5rem);line-height:1;color:#fff;
  font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  font-style:italic;margin-bottom:.5rem;
  text-shadow:0 2px 30px rgba(0,0,0,.35);
}
.hero-sub{font-size:.92rem;color:rgba(168,205,224,.8);line-height:1.65;margin-bottom:.6rem;}
.hero-date{font-size:.8rem;color:var(--sand);letter-spacing:.07em;}

/* ENTRY BTN */
.entry-btn{
  padding:.875rem 2.25rem;
  background:rgba(255,255,255,.12);color:white;
  border:1.5px solid rgba(255,255,255,.3);border-radius:100px;
  font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit;
  transition:background .2s,border-color .2s,transform .1s;
  position:relative;z-index:2;letter-spacing:.02em;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.entry-btn:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5);}
.entry-btn:active{transform:scale(.97);}

/* ── GIFTS SCREEN ── */
#screen-gifts{background:var(--cream);}

.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(250,247,242,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);padding:.875rem 1.25rem;
}
.topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
.topbar-logo{
  font-size:1.1rem;color:var(--text);
  font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  font-style:italic;
}
.topbar-user{font-size:.78rem;color:var(--text-mid);font-weight:500;}

.cat-bar{
  position:sticky;top:49px;z-index:99;
  background:var(--cream);border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.cat-bar::-webkit-scrollbar{display:none;}
.cat-inner{display:flex;gap:.4rem;padding:.65rem 1.25rem;width:max-content;}
.cat-pill{
  padding:.375rem .875rem;border:1.5px solid var(--border);border-radius:100px;
  font-size:.82rem;font-weight:500;color:var(--text-mid);background:white;
  cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit;min-height:34px;
}
.cat-pill:hover{border-color:var(--sky);color:var(--sky);}
.cat-pill.active{background:var(--deep-blue);border-color:var(--deep-blue);color:white;}

.gifts-main{max-width:1100px;margin:0 auto;padding:1.5rem 1.25rem 5rem;}
.section-label{
  font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-lt);margin-bottom:.875rem;
}
.gifts-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:1.125rem;
}

/* GIFT CARD */
.gift-card{
  background:white;border-radius:14px;
  border:1px solid rgba(26,61,87,.07);
  box-shadow:var(--sh);overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .2s,box-shadow .2s,opacity .2s;
}
.gift-card:not(.is-reserved):hover{transform:translateY(-3px);box-shadow:var(--sh-lg);}
.gift-card.is-reserved{opacity:.72;}

.card-header{
  height:88px;display:flex;align-items:center;
  justify-content:center;font-size:2.8rem;position:relative;flex-shrink:0;
}
.bg-habitacion  {background:#EEF5FB;}
.bg-lactancia   {background:#FEF0F5;}
.bg-bano        {background:#EEF8FC;}
.bg-paseos      {background:#FFF5E8;}
.bg-alimentacion{background:#F0FAF3;}
.bg-panales     {background:#FFF9F0;}
.bg-actividades {background:#F5F0FF;}
.bg-ropa        {background:#FFF0F5;}
.bg-especiales  {background:#F5F0EE;}

.priority-badge{
  position:absolute;top:8px;right:8px;
  font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:100px;
}
.badge-must{background:var(--must-bg);color:var(--must);}
.badge-nice{background:var(--nice-bg);color:var(--nice);}

.card-body{padding:.875rem 1rem .5rem;flex:1;display:flex;flex-direction:column;}
.card-name{font-size:.95rem;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:.2rem;}
.card-full{font-size:.78rem;color:var(--text-mid);line-height:1.4;flex:1;}
.card-qty{font-size:.72rem;color:var(--text-lt);margin-top:.2rem;}
.card-rsv-by{font-size:.74rem;color:var(--rsv);font-weight:600;margin-top:.3rem;}

.card-footer{
  padding:.6rem 1rem .875rem;
  border-top:1px solid var(--border);margin-top:.5rem;
}
.btn-reserve{
  width:100%;
  padding:.55rem 1rem;background:var(--deep-blue);color:white;border:none;
  border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;
  font-family:inherit;transition:background .15s,transform .1s;min-height:38px;
  text-align:center;
}
.btn-reserve:hover{background:var(--midnight);}
.btn-reserve:active{transform:scale(.97);}
.btn-reserved{
  width:100%;padding:.55rem 1rem;background:var(--rsv-bg);color:var(--rsv);
  border:1.5px solid var(--rsv);border-radius:8px;
  font-size:.85rem;font-weight:600;cursor:pointer;
  font-family:inherit;min-height:38px;text-align:center;
  transition:opacity .15s;
}
.btn-reserved:hover{opacity:.7;}

/* MODAL */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(12,31,46,.55);z-index:200;
  align-items:flex-end;justify-content:center;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal-overlay.open{display:flex;animation:mfade .2s ease;}
@keyframes mfade{from{opacity:0;}}
.modal-sheet{
  background:white;border-radius:24px 24px 0 0;
  padding:2rem 1.75rem 2.75rem;
  width:100%;max-width:440px;text-align:center;
  animation:slideUp .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slideUp{from{transform:translateY(60px);opacity:0;}}
.modal-big{font-size:2.75rem;line-height:1;margin-bottom:.75rem;}
.modal-title{font-size:1.3rem;font-weight:700;color:var(--text);margin-bottom:.4rem;}
.modal-sub{font-size:.88rem;color:var(--text-mid);line-height:1.6;margin-bottom:1rem;}
.modal-chip{
  background:var(--warm);border-radius:10px;padding:.65rem 1rem;
  font-weight:600;font-size:.9rem;color:var(--text);margin-bottom:1.25rem;
}
.btn-wa{
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  width:100%;padding:.875rem;background:#25D366;color:white;
  border:none;border-radius:12px;font-size:.92rem;font-weight:700;
  cursor:pointer;font-family:inherit;text-decoration:none;margin-bottom:.6rem;
  transition:background .15s;
}
.btn-wa:hover{background:#1EBE5A;}
.btn-close{

  font-size:.85rem;cursor:pointer;padding:.4rem;font-family:inherit;
}
.btn-close:hover{color:var(--text);}

.page-footer{
  text-align:center;padding:2rem 1.25rem;color:var(--text-mid);
  font-size:.88rem;border-top:1px solid var(--border);
  font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  font-style:italic;line-height:1.8;
}

.toast{
  display:none;position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:var(--deep-blue);color:white;padding:.7rem 1.25rem;border-radius:100px;
  font-size:.82rem;font-weight:500;z-index:300;white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}

@media(min-width:520px){
  .modal-overlay{align-items:center;}
  .modal-sheet{border-radius:24px;margin:1rem;}
}
@media(max-width:360px){.gifts-grid{grid-template-columns:1fr;}}
@media(prefers-reduced-motion:reduce){
  .star,.cloud,.bear-wrap svg{animation:none!important;}
  .gift-card,.btn-reserve,.entry-btn,.modal-sheet{transition:none!important;animation:none!important;}
}

/* ── RENDER ── */
function cardHtml(g, rsv) {
  const r = rsv[g.id];
  const cat = CATS[g.cat];
  const badge = g.p==='must'
    ? '<span class="priority-badge badge-must">❤️ Indispensable</span>'
    : '';
  const qtyNote = g.qty>1
    ? `<div class="card-qty">Se necesitan ${g.qty} unidades</div>`
    : '';
  const rsvNote = r
    ? `<div class="card-rsv-by">✓ Ya reservado</div>`
    : '';
  const btn = r
    ? `<button class="btn-reserved" onclick="doRelease(${g.id})">Reservado ✓</button>`
    : `<button class="btn-reserve" onclick="doReserve(${g.id})">Reservar 💙</button>`;

  return `<div class="gift-card${r?' is-reserved':''}" id="card-${g.id}">
    <div class="card-header ${cat.bg}">
      <span role="img">${cat.emoji}</span>${badge}
    </div>
    <div class="card-body">
      <div class="card-name">${escHtml(g.name)}</div>
      <div class="card-full">${escHtml(g.full)}</div>
      ${qtyNote}${rsvNote}
    </div>
    <div class="card-footer">
      ${btn}
    </div>
  </div>`;
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderGrid(){
  const rsv = getRsv();
  const list = filter==='all' ? GIFTS : GIFTS.filter(g=>g.cat===filter);
  const catLabel = filter==='all' ? '' : ` en ${CAT_LABELS[filter]}`;
  const n = list.length;
  document.getElementById('section-label').textContent =
    `${n} ${n===1?'regalo':'regalos'}${catLabel}`;
  document.getElementById('gifts-grid').innerHTML = list.map(g=>cardHtml(g,rsv)).join('');
}

/* ── CATEGORY FILTER ── */
document.getElementById('cat-filter').addEventListener('click', e=>{
  const btn = e.target.closest('.cat-pill');
  if(!btn) return;
  filter = btn.dataset.cat;
  document.querySelectorAll('.cat-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
});

/* ── RESERVE ── */
function doReserve(id){
  const rsv = getRsv();
  rsv[id] = {date:new Date().toISOString()};
  saveRsv(rsv);
  renderGrid();

  const g = GIFTS.find(x=>x.id===id);
  document.getElementById('modal-sub').textContent =
    `Tu reserva quedó guardada en este dispositivo. ¡Avisales a Paula y Breiner por WhatsApp!`;
  document.getElementById('modal-chip').textContent = `🎁 ${g.name}`;

  const msg = encodeURIComponent(`¡Hola Paula! 💙 Reservé "${g.name}" para Matías. ¡Qué emoción para el baby shower del ${SHOWER_DATE}!`);
  document.getElementById('btn-wa').href = PAULA_WA
    ? `https://wa.me/${PAULA_WA}?text=${msg}`
    : `https://wa.me/?text=${msg}`;

  document.getElementById('modal').classList.add('open');
}

/* ── RELEASE ── */
function doRelease(id){
  const rsv = getRsv();
  if(!rsv[id]) return;
  delete rsv[id];
  saveRsv(rsv);
  renderGrid();
  showToast('Reserva cancelada');
}

/* ── MODAL ── */
document.getElementById('btn-close').addEventListener('click', ()=>{
  document.getElementById('modal').classList.remove('open');
});
document.getElementById('modal').addEventListener('click', e=>{
  if(e.target===e.currentTarget) document.getElementById('modal').classList.remove('open');
});

/* ── TOAST ── */
let _tt;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  clearTimeout(_tt); _tt=setTimeout(()=>t.style.display='none', 3000);
}

/* ── SCREENS ── */
function showGifts(){
  renderGrid();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-gifts').classList.add('active');
  window.scrollTo(0,0);
}

document.getElementById('btn-enter').addEventListener('click', showGifts);

/* ── INIT ── */
document.getElementById('screen-welcome').classList.add('active');
</script>
