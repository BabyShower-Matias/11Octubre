<style>
:root {
  --midnight:  #3A4A5A;
  --deep-blue: #3A4A5A;
  --sky:       #7D8CA3;
  --light-sky: #A6D6F2;
  --cream:     #F2EFEA;
  --warm:      #F2EFEA;
  --border:    #D8C3A5;
  --text:      #3A4A5A;
  --text-mid:  #7D8CA3;
  --text-lt:   #A6B0BC;
  --must-bg:   #FDE8E8; --must: #C84040;
  --rsv-bg:    #E6F6F5; --rsv:  #2E8E8E;
  --sh:   0 2px 16px rgba(58,74,90,.09);
  --sh-lg: 0 8px 32px rgba(58,74,90,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  font-size:16px;color:var(--text);background:var(--cream);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}

/* ── BANNER HEADER ── */
.page-banner{
  background:var(--midnight);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:1.4rem 1.5rem 1.6rem;
  text-align:center;gap:.3rem;
}
.banner-stars{position:absolute;inset:0;pointer-events:none;}
.banner-star{
  position:absolute;border-radius:50%;background:white;
  animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s);
}
@keyframes twinkle{0%,100%{opacity:var(--op,.7);}50%{opacity:.1;}}
.banner-cloud{
  position:absolute;height:18px;
  background:rgba(168,205,224,.1);border-radius:50px;
  animation:drift var(--cd,70s) linear infinite var(--cdelay,0s);
}
.banner-cloud::before,.banner-cloud::after{content:'';position:absolute;background:inherit;border-radius:50%;}
.banner-cloud::before{width:45%;height:200%;top:-60%;left:20%;}
.banner-cloud::after {width:30%;height:180%;top:-50%;right:20%;}
@keyframes drift{from{transform:translateX(calc(-100% - 200px));}to{transform:translateX(calc(100vw + 200px));}}

.banner-bear{
  position:relative;z-index:2;
  animation:float 4s ease-in-out infinite;
  margin-bottom:.25rem;
}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.banner-eyebrow{
  position:relative;z-index:2;
  font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--light-sky);
}
.banner-name{
  position:relative;z-index:2;
  font-size:clamp(2.6rem,10vw,4rem);line-height:1;color:#fff;
  font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  font-style:italic;text-shadow:0 2px 20px rgba(0,0,0,.3);
}
.banner-sub{
  position:relative;z-index:2;
  font-size:.82rem;color:rgba(168,205,224,.75);letter-spacing:.04em;
}

/* ── STICKY TOPBAR ── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(250,247,242,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);padding:.75rem 1.25rem;
}
.topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
.topbar-logo{
  font-size:1rem;color:var(--text);
  font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  font-style:italic;
}
.sync-dot{
  width:8px;height:8px;border-radius:50%;background:var(--rsv);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ── CATEGORY BAR ── */
.cat-bar{
  position:sticky;top:46px;z-index:99;
  background:var(--cream);border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.cat-bar::-webkit-scrollbar{display:none;}
.cat-inner{display:flex;gap:.4rem;padding:.6rem 1.25rem;width:max-content;}
.cat-pill{
  padding:.45rem 1rem;border:1.5px solid var(--border);border-radius:100px;
  font-size:.85rem;font-weight:500;color:var(--text-mid);background:white;
  cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit;min-height:36px;
}
.cat-pill:hover{border-color:var(--sky);color:var(--sky);}
.cat-pill.active{background:var(--deep-blue);border-color:var(--deep-blue);color:white;}

/* ── GRID ── */
.gifts-main{max-width:1100px;margin:0 auto;padding:1.25rem 1rem 5rem;}
.section-label{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-lt);margin-bottom:1rem;}
.gifts-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:1rem;
}
@media(min-width:480px){.gifts-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:900px){.gifts-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.125rem;}}

/* ── GIFT CARD ── */
.gift-card{
  background:white;border-radius:14px;border:1px solid rgba(26,61,87,.07);
  box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .2s,box-shadow .2s,opacity .2s;
}
.gift-card:not(.is-reserved):hover{transform:translateY(-3px);box-shadow:var(--sh-lg);}
.gift-card.is-reserved{opacity:.72;}

.card-img-wrap{
  height:160px;display:flex;align-items:center;justify-content:center;
  background:#EDE5D8;position:relative;flex-shrink:0;overflow:hidden;
}
.card-img{
  max-width:100%;max-height:100%;width:100%;height:100%;
  object-fit:contain;padding:12px;
}
.priority-badge{
  position:absolute;top:8px;right:8px;font-size:.62rem;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:100px;
}
.badge-must{background:var(--must-bg);color:var(--must);}

.card-body{padding:.9rem 1rem .5rem;flex:1;display:flex;flex-direction:column;}
.card-name{font-size:1rem;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:.25rem;}
.card-full{font-size:.84rem;color:var(--text-mid);line-height:1.45;flex:1;}
.card-qty{font-size:.76rem;color:var(--text-lt);margin-top:.3rem;}
.card-rsv{font-size:.78rem;color:var(--rsv);font-weight:600;margin-top:.3rem;}

.card-footer{padding:.7rem 1rem .95rem;border-top:1px solid var(--border);margin-top:.5rem;}
.btn-reserve{
  width:100%;padding:.7rem 1rem;background:var(--deep-blue);color:white;border:none;
  border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;
  font-family:inherit;transition:background .15s,transform .1s;min-height:46px;
}
.btn-reserve:hover{background:var(--midnight);}
.btn-reserve:active{transform:scale(.97);}
.btn-reserved{
  width:100%;padding:.7rem 1rem;background:var(--rsv-bg);color:var(--rsv);
  border:1.5px solid var(--rsv);border-radius:10px;
  font-size:.95rem;font-weight:600;cursor:pointer;
  font-family:inherit;min-height:46px;transition:opacity .15s;
}
.btn-reserved:hover{opacity:.7;}
.btn-reserved.locked{cursor:default;opacity:.5;pointer-events:none;}

/* ── MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(12,31,46,.55);z-index:200;
  align-items:flex-end;justify-content:center;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal-overlay.open{display:flex;animation:mfade .2s ease;}
@keyframes mfade{from{opacity:0;}}
.modal-sheet{
  background:white;border-radius:24px 24px 0 0;
  padding:2rem 1.75rem 2.75rem;width:100%;max-width:440px;text-align:center;
  animation:slideUp .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slideUp{from{transform:translateY(60px);opacity:0;}}
.modal-big{font-size:2.75rem;line-height:1;margin-bottom:.75rem;}
.modal-title{font-size:1.3rem;font-weight:700;color:var(--text);margin-bottom:.5rem;}
.modal-sub{font-size:.92rem;color:var(--text-mid);line-height:1.65;margin-bottom:1rem;}
.modal-chip{
  background:var(--warm);border-radius:10px;padding:.65rem 1rem;
  font-weight:600;font-size:.92rem;color:var(--text);margin-bottom:1rem;
}
.modal-love{
  font-size:.85rem;color:var(--text-lt);
  font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  font-style:italic;line-height:1.7;margin-bottom:1.5rem;
}
.btn-close{
  display:block;width:100%;padding:.85rem;
  background:var(--deep-blue);color:white;border:none;border-radius:10px;
  font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit;min-height:50px;
  transition:background .15s;
}
.btn-close:hover{background:var(--midnight);}

.page-footer{
  text-align:center;padding:2rem 1.25rem;color:var(--text-mid);font-size:.9rem;
  border-top:1px solid var(--border);
  font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  font-style:italic;line-height:1.8;
}
.toast{
  display:none;position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:var(--deep-blue);color:white;padding:.75rem 1.5rem;border-radius:100px;
  font-size:.85rem;font-weight:500;z-index:300;white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
@media(min-width:520px){
  .modal-overlay{align-items:center;}
  .modal-sheet{border-radius:24px;margin:1rem;}
}
@media(prefers-reduced-motion:reduce){
  .banner-star,.banner-cloud,.banner-bear,.sync-dot{animation:none!important;}
  .gift-card,.btn-reserve,.modal-sheet{transition:none!important;animation:none!important;}
}
</style>

})();

/* ── RENDER ── */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function cardHtml(g) {
  const r     = currentRsv[g.id];
  const isMine = !!myTokens[g.id];
  const badge  = g.p==='must' ? '<span class="priority-badge badge-must">❤️ Indispensable</span>' : '';
  const qtyNote= g.qty>1 ? `<div class="card-qty">Se necesitan ${g.qty} unidades</div>` : '';
  const rsvNote= r ? `<div class="card-rsv">✓ Ya reservado</div>` : '';
  const btn = r
    ? isMine
      ? `<button class="btn-reserved" onclick="doRelease(${g.id})">Reservado ✓ — cancelar</button>`
      : `<button class="btn-reserved locked">Reservado ✓</button>`
    : `<button class="btn-reserve" onclick="doReserve(${g.id})">Reservar 💙</button>`;
  return `<div class="gift-card${r?' is-reserved':''}" id="card-${g.id}">
    <div class="card-img-wrap">
      <img class="card-img" src="${g.img}" alt="${esc(g.name)}" loading="lazy">
      ${badge}
    </div>
    <div class="card-body">
      <div class="card-name">${esc(g.name)}</div>
      <div class="card-full">${esc(g.full)}</div>
      ${qtyNote}${rsvNote}
    </div>
    <div class="card-footer">${btn}</div>
  </div>`;
}

function renderGrid() {
  const list = filter==='all' ? GIFTS : filter==='must' ? GIFTS.filter(g=>g.p==='must') : GIFTS.filter(g=>g.cat===filter);
  const n = list.length;
  const catLabel = filter==='all' ? '' : filter==='must' ? ' indispensables' : ` en ${CAT_LABELS[filter]}`;
  document.getElementById('section-label').textContent = `${n} ${n===1?'regalo':'regalos'}${catLabel}`;
  document.getElementById('gifts-grid').innerHTML = list.map(cardHtml).join('');
}

/* ── FILTERS ── */
document.getElementById('cat-filter').addEventListener('click', e=>{
  const btn = e.target.closest('.cat-pill');
  if(!btn) return;
  filter = btn.dataset.cat;
  document.querySelectorAll('.cat-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
});

/* ── RESERVE ── */
function doReserve(id) {
  const token = Math.random().toString(36).slice(2);
  if (db) {
    db.ref('reservations/'+id).set({ date: new Date().toISOString(), token });
  } else {
    currentRsv[id] = { date: new Date().toISOString(), token };
    localStorage.setItem('matias_rsv', JSON.stringify(currentRsv));
    renderGrid();
  }
  myTokens[id] = token;
  saveMyTokens();
  const g = GIFTS.find(x=>x.id===id);
  document.getElementById('modal-chip').textContent = `🎁 ${g.name}`;
  document.getElementById('modal').classList.add('open');
}

/* ── RELEASE ── */
function doRelease(id) {
  if(!myTokens[id]) return;
  if (db) {
    db.ref('reservations/'+id).remove();
  } else {
    delete currentRsv[id];
    localStorage.setItem('matias_rsv', JSON.stringify(currentRsv));
    renderGrid();
  }
  delete myTokens[id];
  saveMyTokens();
  showToast('Reserva cancelada');
}

/* ── MODAL ── */
document.getElementById('btn-close').addEventListener('click', ()=>{
  document.getElementById('modal').classList.remove('open');
});
document.getElementById('modal').addEventListener('click', e=>{
  if(e.target===e.currentTarget) document.getElementById('modal').classList.remove('open');
});

/* ── TOAST ── */
let _tt;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  clearTimeout(_tt); _tt=setTimeout(()=>t.style.display='none',3000);
}
</script>
</body>
</html>
